<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<content-container>
</content-container>
  <script type="text/javascript">
    <![CDATA[
fetch('https://raw.githubusercontent.com/UnblockingHub/UBHub/main/index.html')
